name: mobile-station

# Isolated local infrastructure for Mobile Station (non-colliding host ports vs Glorov).
# Services are cleanly separated by role:
#   1. postgres     -> Transactional Commerce Database (5434)
#   2. redis        -> Cache, Event Bus & Job Queues (6380)
#   3. meilisearch  -> Full-Text & Faceted Specs Search Engine (7700)
#   4. minio        -> S3-Compatible Object Storage for Invoices, CSVs & Backups (9100/9101)
# Note: Public product & banner images use a separate Cloudinary account (CLOUDINARY_*).

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobile-station-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ms_postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ms_dev_postgres_password}
      POSTGRES_DB: ${DB_NAME:-mobile_station_medusa}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - ms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ms_postgres} -d ${DB_NAME:-mobile_station_medusa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mobile-station-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: mobile-station-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-ms_dev_meilisearch_master_key_32chars}
    ports:
      - "${MEILI_HOST_PORT:-7700}:7700"
    volumes:
      - ms_meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mobile-station-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-ms_minio_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-ms_minio_secret_12345}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - ms_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: mobile-station-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set msminio http://minio:9000 ${STORAGE_S3_ACCESS_KEY_ID:-ms_minio_admin} ${STORAGE_S3_SECRET_ACCESS_KEY:-ms_minio_secret_12345};
      mc mb --ignore-existing msminio/${STORAGE_S3_BUCKET:-mobile-station-private};
      exit 0;
      "

volumes:
  ms_pgdata:
  ms_redisdata:
  ms_meilidata:
  ms_miniodata:
